packages:
  - 'packages/*'
  - 'apps/*'

# pnpm v11 lee la configuración desde aquí (no desde .npmrc). El layout hoisted
# venía de la app Expo (ya retirada); se conserva porque la web y su lockfile
# están validados con él y cambiarlo no aporta nada.
nodeLinker: hoisted

allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
