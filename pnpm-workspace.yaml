packages:
  - 'packages/*'
  - 'apps/*'

# pnpm v11 lee la configuración desde aquí (no desde .npmrc). Layout hoisted:
# Expo/Metro hacen require("@babel/*") "pelón" y necesitan los paquetes de
# babel accesibles en node_modules top-level (isolated los oculta → falla el
# bundling en Expo Go y en EAS Build).
nodeLinker: hoisted

allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
