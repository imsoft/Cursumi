packages:
  - 'packages/*'
  - 'apps/*'

# pnpm v11 lee la configuración desde aquí (no desde .npmrc). El layout hoisted
# venía de la app Expo (ya retirada); se conserva porque la web y su lockfile
# están validados con él y cambiarlo no aporta nada.
nodeLinker: hoisted

allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Parches de seguridad en dependencias transitivas (pnpm audit). Revisar y
# quitar cuando los paquetes que las traen suban por su cuenta.
overrides:
  effect: ^3.22.1 # prisma/@prisma/config lo fija en 3.20.0
  dompurify: ^3.4.17 # dependencia de jspdf
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1 # tooling de lint
  '@ts-morph/common>minimatch': ^11.0.1 # CLI de shadcn
