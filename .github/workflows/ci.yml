name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Variables mínimas para que Next.js pueda hacer el build sin conexión real a BD
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      BETTER_AUTH_SECRET: "ci-secret-placeholder-32-chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      RESEND_API_KEY: "re_placeholder"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
      CLOUDINARY_API_KEY: "placeholder"
      CLOUDINARY_API_SECRET: "placeholder"
      MUX_TOKEN_ID: "placeholder"
      MUX_TOKEN_SECRET: "placeholder"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      CRON_SECRET: "placeholder"
      CONTACT_INBOX_EMAIL: "test@example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (web)
        run: pnpm --filter @cursumi/web exec tsc --noEmit

      # La app móvil no tiene build en CI, así que este es el único sitio donde
      # se detecta que una dependencia compartida (better-auth, por ejemplo)
      # cambió su API para el cliente Expo.
      - name: TypeScript check (mobile)
        run: pnpm --filter @cursumi/mobile exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E requiere una BD real y datos de prueba, así que solo corre cuando el
  # secret NEON_DATABASE_URL está configurado. El contexto `secrets` no está
  # disponible en el `if` de un job (el workflow entero se rechazaba y CI no
  # ejecutaba NINGÚN job), por eso la comprobación vive en este job puerta,
  # que sí puede leerlo desde `env` en un step.
  e2e-gate:
    name: ¿E2E habilitado?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$NEON_DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NEON_DATABASE_URL no está configurado: se omiten los E2E."
          fi

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, e2e-gate]
    if: needs.e2e-gate.outputs.enabled == 'true'

    env:
      # Aquí sí hace falta la BD real: los E2E navegan la app con datos.
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BETTER_AUTH_SECRET: "ci-secret-placeholder-32-chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      RESEND_API_KEY: "re_placeholder"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
      CLOUDINARY_API_KEY: "placeholder"
      CLOUDINARY_API_SECRET: "placeholder"
      MUX_TOKEN_ID: "placeholder"
      MUX_TOKEN_SECRET: "placeholder"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      CRON_SECRET: "placeholder"
      CONTACT_INBOX_EMAIL: "test@example.com"
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Start server & run E2E tests
        run: |
          pnpm start &
          SERVER_PID=$!
          # Esperar a que el servidor esté listo (hasta 60 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Servidor listo en el intento $i"
              break
            fi
            sleep 2
          done
          pnpm exec playwright test --reporter=list
          EXIT_CODE=$?
          kill $SERVER_PID || true
          exit $EXIT_CODE

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # prisma generate (postinstall) necesita DATABASE_URL aunque sea fake
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm lint

      - name: Lint (mobile)
        run: pnpm --filter @cursumi/mobile lint -- --max-warnings=1000
