name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base: los PR apilados (p. ej. Android sobre iOS) también
  # deben pasar por CI antes de que su base se mergee a main.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Variables mínimas para que Next.js pueda hacer el build sin conexión real a BD
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      BETTER_AUTH_SECRET: "ci-secret-placeholder-32-chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      RESEND_API_KEY: "re_placeholder"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
      CLOUDINARY_API_KEY: "placeholder"
      CLOUDINARY_API_SECRET: "placeholder"
      MUX_TOKEN_ID: "placeholder"
      MUX_TOKEN_SECRET: "placeholder"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      CRON_SECRET: "placeholder"
      CONTACT_INBOX_EMAIL: "test@example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (web)
        run: pnpm --filter @cursumi/web exec tsc --noEmit

      # La app móvil no tiene build en CI, así que este es el único sitio donde
      # se detecta que una dependencia compartida (better-auth, por ejemplo)
      # cambió su API para el cliente Expo.
      - name: TypeScript check (mobile)
        run: pnpm --filter @cursumi/mobile exec tsc --noEmit

      # En apps/mobile las versiones las fija la SDK de Expo, no el semver de
      # npm. tsc no detecta esa deriva: un PR que suba react a una versión que
      # la SDK no espera compila igual y pasa CI en verde (ocurrió en #49).
      # Esta es la única comprobación que lo caza.
      - name: Versiones alineadas con la SDK de Expo
        run: pnpm --filter @cursumi/mobile exec expo install --check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E requiere una BD real y datos de prueba, así que solo corre cuando el
  # secret NEON_DATABASE_URL está configurado. El contexto `secrets` no está
  # disponible en el `if` de un job (el workflow entero se rechazaba y CI no
  # ejecutaba NINGÚN job), por eso la comprobación vive en este job puerta,
  # que sí puede leerlo desde `env` en un step.
  e2e-gate:
    name: ¿E2E habilitado?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$NEON_DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NEON_DATABASE_URL no está configurado: se omiten los E2E."
          fi

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, e2e-gate]
    if: needs.e2e-gate.outputs.enabled == 'true'

    env:
      # Aquí sí hace falta la BD real: los E2E navegan la app con datos.
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BETTER_AUTH_SECRET: "ci-secret-placeholder-32-chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      RESEND_API_KEY: "re_placeholder"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
      CLOUDINARY_API_KEY: "placeholder"
      CLOUDINARY_API_SECRET: "placeholder"
      MUX_TOKEN_ID: "placeholder"
      MUX_TOKEN_SECRET: "placeholder"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      CRON_SECRET: "placeholder"
      CONTACT_INBOX_EMAIL: "test@example.com"
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Start server & run E2E tests
        run: |
          pnpm start &
          SERVER_PID=$!
          # Esperar a que el servidor esté listo (hasta 60 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Servidor listo en el intento $i"
              break
            fi
            sleep 2
          done
          pnpm exec playwright test --reporter=list
          EXIT_CODE=$?
          kill $SERVER_PID || true
          exit $EXIT_CODE

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # prisma generate (postinstall) necesita DATABASE_URL aunque sea fake
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm lint

      - name: Lint (mobile)
        run: pnpm --filter @cursumi/mobile lint -- --max-warnings=1000

  # App nativa de iOS (apps/ios). El repo es público, así que los runners de
  # macOS no cuestan minutos. Compila y corre las pruebas unitarias en el
  # simulador; el .xcodeproj se genera aquí con XcodeGen desde project.yml.
  ios:
    name: iOS (build + tests)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # El nombre del simulador cambia con cada imagen de runner; tomamos el
      # primer iPhone disponible en vez de fijar un modelo.
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build
        run: |
          xcodebuild build -project Cursumi.xcodeproj -scheme Cursumi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Unit tests
        run: |
          xcodebuild test -project Cursumi.xcodeproj -scheme Cursumi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO -quiet

  # App nativa de Android (apps/android). Compila el APK de debug y corre las
  # pruebas unitarias. El wrapper de Gradle va versionado, así que no hay que
  # instalar nada más que el JDK y el SDK (el runner ya trae el SDK).
  android:
    name: Android (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
